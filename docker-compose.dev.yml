name: myapp-dev

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability-dev/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    ports: ["9090:9090"]
    volumes:
      - ./observability-dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki.yml
    ports: ["3100:3100"]
    volumes:
      - ./observability-dev/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    command: -config.file=/etc/tempo/tempo.yml
    ports: ["3200:3200"]
    volumes:
      - ./observability-dev/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3000:3000"]
    volumes:
      - ./observability-dev/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["9093:9093"]
    volumes:
      - ./observability-dev/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  myapp-apihost:
    build:
      context: ./backend
      args:
        PROJECT: src/Services/MyApp.ApiHost/MyApp.ApiHost.csproj
        ASSEMBLY: MyApp.ApiHost.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Users: Data Source=/data/users.db
      ConnectionStrings__Catalog: Data Source=/data/catalog.db
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      Elasticsearch__Uri: http://elasticsearch:9200
      Jwt__Secret: uIqdROcht3Rmk5WcICgyvWiYr1kmj/FMA3ajChJTpIeY94voZ6VQJDLakHLzecuq
      Jwt__Issuer: secure-api
      Jwt__Audience: secure-api-clients
      Seed__AdminEmail: admin@example.com
      Seed__AdminPassword: ChangeMe-12345
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_DEPLOYMENT_ENVIRONMENT: dev
    ports: ["5101:8080"]
    volumes:
      - apihost-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  myapp-ordersapi:
    build:
      context: ./backend
      args:
        PROJECT: src/Services/MyApp.OrdersApi/MyApp.OrdersApi.csproj
        ASSEMBLY: MyApp.OrdersApi.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Orders: Data Source=/data/orders.db
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_DEPLOYMENT_ENVIRONMENT: dev
    ports: ["5103:8080"]
    volumes:
      - orders-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  myapp-invoicesapi:
    build:
      context: ./backend
      args:
        PROJECT: src/Services/MyApp.InvoicesApi/MyApp.InvoicesApi.csproj
        ASSEMBLY: MyApp.InvoicesApi.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Invoices: Data Source=/data/invoices.db
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_DEPLOYMENT_ENVIRONMENT: dev
    ports: ["5102:8080"]
    volumes:
      - invoices-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  myapp-shippingapi:
    build:
      context: ./backend
      args:
        PROJECT: src/Services/MyApp.ShippingApi/MyApp.ShippingApi.csproj
        ASSEMBLY: MyApp.ShippingApi.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Shipping: Data Source=/data/shipping.db
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_DEPLOYMENT_ENVIRONMENT: dev
    ports: ["5104:8080"]
    volumes:
      - shipping-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  myapp-gateway:
    build:
      context: ./backend
      args:
        PROJECT: src/Services/MyApp.Gateway/MyApp.Gateway.csproj
        ASSEMBLY: MyApp.Gateway.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OpenApi__GatewayPublicUrl: http://localhost:5100
      OpenApi__AuthBaseUrl: http://myapp-apihost:8080
      OpenApi__OrdersBaseUrl: http://myapp-ordersapi:8080
      OpenApi__InvoicesBaseUrl: http://myapp-invoicesapi:8080
      OpenApi__ShippingBaseUrl: http://myapp-shippingapi:8080
      ReverseProxy__Clusters__auth__Destinations__d1__Address: http://myapp-apihost:8080/
      ReverseProxy__Clusters__orders__Destinations__d1__Address: http://myapp-ordersapi:8080/
      ReverseProxy__Clusters__invoices__Destinations__d1__Address: http://myapp-invoicesapi:8080/
      ReverseProxy__Clusters__shipping__Destinations__d1__Address: http://myapp-shippingapi:8080/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_DEPLOYMENT_ENVIRONMENT: dev
    ports: ["5100:8080"]
    depends_on:
      - myapp-apihost
      - myapp-ordersapi
      - myapp-invoicesapi
      - myapp-shippingapi
    restart: unless-stopped

volumes:
  prom-data:
  loki-data:
  tempo-data:
  grafana-data:
  apihost-data:
  orders-data:
  invoices-data:
  shipping-data:
